<button class="cart-btn">加入購物車</button>.cart-btn {
  background-color: #28a745;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 18px;
  border-radius: 6px;
  transition: background-color 0.3s, transform 0.1s;
}
.cart-btn:hover {
  background-color: #218838;
  cursor: pointer;
}
.cart-btn:active {
  transform: scale(0.95);
}
